<!DOCTYPE html>
<html lang="en">
<head>

    <title>todo using Jsonplaceholder web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"

            <div class = "col-md-4">

                        <div class = "card-body">

                             <div class = "form-group mb-4">
                                <label for = "userId">User ID:</label>
                                <input type = number class = "form-control" id = "userId">
                            </div>


                            <div class = "form-group mb-4">
                                <label for = "todo">ADD TODO:</label>
                                <input type = "text" class = "form-control" id = "addTodo">
                            </div>


                            <button type = "submit" class = "work btn btn-primary btn-sm" id = "submitBtn">Submit</button>
                            <button type = "button" class = "work btn btn-danger btn-sm d-none" id = "updateBtn">Update</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
